# @package _global_

defaults:
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /benchmark/nav/objectnav: objectnav_hm3d
  - /habitat/task/lab_sensors:
      - base_explorer
      - compass_sensor
      - gps_sensor
      - heading_sensor
      - frontier_sensor
  - /habitat/task/measurements:
      - frontier_exploration_map
      - traveled_stairs
      - cumulative_elevation_change
  - /habitat_baselines/rl/policy: vlvm_policy
  - _self_

habitat:
  environment:
    iterator_options:
      max_scene_repeat_steps: 50000
  task:
    success_reward: 2.5
    slack_reward: -1e-3
    
    lab_sensors:
      base_explorer:
        turn_angle: 30
    measurements:
      traveled_stairs:
        type: "TraveledStairs"
      cumulative_elevation_change:
        type: "CumulativeElevationChange"

habitat_baselines:
  evaluate: True
  eval_ckpt_path_dir: data/dummy_policy.pth
  num_environments: 1
  load_resume_state_config: False

  torch_gpu_id: 0
  tensorboard_dir: "tb"
  video_dir: "video_dir"
  test_episode_count: -1
  checkpoint_folder: "data/new_checkpoints"
  trainer_name: "vlvm" 
  log_interval: 10
  force_torch_single_threaded: True

  eval:
    split: "val"

  rl:
    policy:
      name: "HabitatITMPolicyV1" 

      pointnav_policy_path: "data/pointnav_weights.pth"
      depth_image_shape: [224, 224]
      fov_angle: 79.0
      camera_height: 0.88
      text_prompt: "Seems like there is a target_object ahead."
      visualize: False
      init_turn_steps: 12
      min_depth: 0.5
      max_depth: 5.0
      pointnav_stop_radius: 0.90
      enable_stats: True

      # Obstacle map
      om_style: "probabilistic" # probabilistic / obstacle
      voxel_size: 0.05
      min_obstacle_height: 0.15
      max_obstacle_height: 1.50
      hole_area_thresh: 100000
      log_odds_occ: 2.0
      log_odds_free: -2.0
      occ_threshold: 0.0
      free_threshold: 0.0
      obstacle_map_area_threshold: 1.5
      ## Dilation / Structuring element 
      agent_radius: 0.18
      agent_height: 0.88
      nav_slice_height: 0.30
      # Value map
      vm_style: "region"  # "region" / "surface"
      h_lam: 0.3
      h_norm_max: 1.0
      h_z_min: 0.15
      h_z_max: 0.88
      query_radius_m: 0.5
      query_z_min: 0.15
      query_z_max: 1.50

      # TSP3D query
      sigma_tar: 0.60
      sigma_prop: 0.45  # Service return threshold; policy admission stays at sigma_tar.
      # Target-memory lifecycle
      merge_dist_thresh: 0.5
      ema_weight_old: 0.8
      lock_exempt: True
      lock_exempt_identity: True
      ## fallback
      enable_provisional_gate: True # Provisional gate: 0.50-0.60, 1.0-4.0 m.
      provisional_sigma: 0.50
      provisional_min_dist: 1.0
      provisional_max_dist: 4.0
      provisional_s_min: 0.07
      upgrade_min_obs: 2
      upgrade_max_dist: 4.0
      upgrade_sigma_min: 0.52
      stop_gate_confirm_radius: 1.2
      stop_gate_turns: 3
      enable_stable_pool: True  # Merge + Stable deletion pool.
      hide_stable_from_selection: True
      merge_new_info_dist: 0.2
      merge_new_info_yaw: 10.0
      merge_new_info_steps: 3
      stable_stale_purge: 60
      stable_miss_delete: 5
      stable_total_miss: 8
      stable_revive_radius: 0.5
      stable_revive_window: 10
      stable_revive_min_sigma: 0.50
      confirmed_to_stable_misses: 3
      provisional_to_stable_misses: 3
      sigma_sce: 0.15
      tau: 0.15
      near_field_dist: 1.0
      near_field_sigma_scale: 0.8
      # TSP3D Input Processing
      use_vlfm_nlp: False
      fusion_style: world   # Fusion route: "world" / "none"
      fuse_max_points: 200000
      wm_max_frames: 8
      wm_voxel_size: 0.02
      wm_max_voxels: 400000
      wm_radius: 6.0
      wm_min_view_disp: 0.15
      wm_min_view_yaw: 15.0
      wm_near_refresh_radius: 3.0
      wm_near_refresh_value: True
      cap_style: random # point cap - "random" (baseline) / "near_first"
      det_seed: 0 # per-step numpy reseed base (same config -> bit-stable double-run)
      distance_sample: True
      near_dist: 1.5
      mid_dist: 3.0
      near_voxel: 0.01
      mid_voxel: 0.02
      far_voxel: 0.05

      # Occupancy-consistency geometric gate
      enable_occ_consistency: True
      occ_min_voxels: 8
      occ_min_ratio: 0.001
      # S-penalty
      enable_s_penalty: True
      s_penalty_thresh: 0.14
      s_penalty_uncovered_w: 1.0         # Weight for no coverage (S<=0/None): 1.0 = free pass; <1.0 = mild penalty.
      det_log_dir: null                  # Per-detection jsonl output directory; null = off (diagnostics only).
      # near-surface point
      s_penalty_use_surface: True
      goal_use_surface: True
      

    ppo:
      clip_param: 0.2
      ppo_epoch: 4
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.2
      num_steps: 64
      use_gae: True
      gamma: 0.99
      tau: 0.95
