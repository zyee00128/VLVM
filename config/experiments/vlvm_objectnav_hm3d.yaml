# @package _global_

defaults:
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /benchmark/nav/objectnav: objectnav_hm3d
  - /habitat/task/lab_sensors:
      - base_explorer
      - compass_sensor
      - gps_sensor
      - heading_sensor
      - frontier_sensor
  - /habitat/task/measurements:
      - frontier_exploration_map
      - traveled_stairs
      - cumulative_elevation_change
  - /habitat_baselines/rl/policy: vlvm_policy
  - _self_

habitat:
  environment:
    iterator_options:
      max_scene_repeat_steps: 50000
  task:
    success_reward: 2.5
    slack_reward: -1e-3
    lab_sensors:
      base_explorer:
        turn_angle: 30
    measurements:
      traveled_stairs:
        type: "TraveledStairs"
      cumulative_elevation_change:
        type: "CumulativeElevationChange"

habitat_baselines:
  evaluate: True
  eval_ckpt_path_dir: data/dummy_policy.pth
  num_environments: 1
  load_resume_state_config: False

  torch_gpu_id: 0
  tensorboard_dir: "tb"
  video_dir: "video_dir"
  test_episode_count: -1
  checkpoint_folder: "data/new_checkpoints"
  trainer_name: "vlvm" 
  log_interval: 10
  force_torch_single_threaded: True

  eval:
    split: "val"

  rl:
    policy:
      name: "HabitatITMPolicyV1" 

      pointnav_policy_path: "data/pointnav_weights.pth"
      depth_image_shape: [224, 224]
      fov_angle: 79.0
      camera_height: 0.88
      text_prompt: "Seems like there is a target_object ahead."
      visualize: False
      init_turn_steps: 12
      min_depth: 0.5
      max_depth: 5.0
      
      pointnav_stop_radius: 0.90 # 0.90
      # Anti-hallucination fallback
      enable_fb: True
      fb_near_radius: 2.5
      fb_hysteresis: 5
      fb_suspicious_hysteresis: 2
      fb_suspicious_conf: 0.75

      om_style: "probabilistic" # probabilistic/ obstacle
      voxel_size: 0.05
      min_obstacle_height: 0.15
      max_obstacle_height: 1.50
      hole_area_thresh: 100000
      log_odds_occ: 2.0
      log_odds_free: -2.0
      occ_threshold: 0.0
      free_threshold: 0.0
      obstacle_map_area_threshold: 1.5
      ## Dilation / structuring element 
      agent_radius: 0.18
      agent_height: 0.88
      nav_slice_height: 0.30

      vm_style: "region"  # "region" (V1) / "surface" (V2)
      h_lam: 0.3
      h_norm_max: 1.0
      h_z_min: 0.15
      h_z_max: 0.88
      query_radius_m: 0.5
      query_z_min: 0.15
      query_z_max: 1.50

      sigma_tar: 0.70
      sigma_sce: 0.15
      tau: 0.15
      near_field_dist: 1.0
      near_field_sigma_scale: 0.8
      # TSP3D Input Processing
      use_raw_nlp: False
      # D1/D2/D3 send-side post-processing (shared by both fusion routes)
      cap_style: random           # D1: point cap - "random" (baseline) / "near_first"
      send_voxel_size: null       # D2: send-side re-voxelization (m), null = skip
      distance_sample: False      # D3: distance-adaptive sampling (dense near / sparse far)
      near_dist: 1.5
      mid_dist: 3.0
      near_voxel: 0.01
      mid_voxel: 0.02
      far_voxel: 0.05
      use_world_map: False

      pcd_window_size: 8
      fuse_voxel_size: 0.02
      fuse_max_points: 200000
      cam_radius: null
      cam_min_view_disp: 0.15
      cam_min_view_yaw: 15.0
      wm_max_frames: 8
      wm_voxel_size: 0.02
      wm_max_voxels: 400000
      wm_radius: 6.0
      wm_min_view_disp: 0.15
      wm_min_view_yaw: 15.0
      # S-penalty
      enable_s_penalty: True
      s_penalty_gate_admission: True
      s_penalty_thresh: 0.15         # S below this (ITM cosine scale ~0.10-0.15) -> apply penalty
      s_penalty_floor: 0.3           # lower bound of dynamic weight w_S = max(floor, S/thresh) when S < thresh (S->0 -> floor)
      s_penalty_radius_m: 0.5        # S query radius (m) around detection centroid
      
      # 4.6.1 多候选 + top-1（模型侧 NMS score 阈值 / 策略侧写记忆只取最高 c'）
      nms_score_thr: null            # null = 单候选基线（nms_pre=1）；如 0.5~0.7 启用多候选
      top1_write: False              # True = 多候选时每帧只写最高 c' 的检测

    ppo:
      clip_param: 0.2
      ppo_epoch: 4
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.2
      num_steps: 64
      use_gae: True
      gamma: 0.99
      tau: 0.95
